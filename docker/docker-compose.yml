version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: meetbuddy
      POSTGRES_PASSWORD: meetbuddy
      POSTGRES_DB: meetbuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetbuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meetbuddy
      MINIO_ROOT_PASSWORD: meetbuddy123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 meetbuddy meetbuddy123;
      mc mb --ignore-existing local/meetbuddy;
      mc anonymous set download local/meetbuddy;
      exit 0;
      "

  api:
    build:
      context: ../apps/api
      dockerfile: ../../docker/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://meetbuddy:meetbuddy@postgres:5432/meetbuddy
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app

  worker:
    build:
      context: ../apps/api
      dockerfile: ../../docker/Dockerfile.api
    command: celery -A tasks.celery_app worker --loglevel=info
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://meetbuddy:meetbuddy@postgres:5432/meetbuddy
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app

  web:
    build:
      context: ../apps/web
      dockerfile: ../../docker/Dockerfile.web
    env_file: ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
